name: Go Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Go Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.20'
        cache: true
    
    - name: Build Go application
      working-directory: k8scontroller
      run: |
        go mod tidy
        go build -v ./... 