apiVersion: v1
kind: ServiceAccount
metadata:
  name: counter-controller
  namespace: counter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: counter-controller
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: counter-controller
subjects:
- kind: ServiceAccount
  name: counter-controller
  namespace: counter
roleRef:
  kind: ClusterRole
  name: counter-controller
  apiGroup: rbac.authorization.k8s.io 